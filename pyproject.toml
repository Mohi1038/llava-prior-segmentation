[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llava-prior-segmentation"
version = "0.1.0"
description = "Training-free open-vocabulary semantic segmentation with LLaVA priors."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "Pillow>=10.0",
    "torch>=2.2",
    "transformers>=4.45",
    "accelerate>=0.26",
    "opencv-python>=4.9",
]

[project.optional-dependencies]
sam = ["segment-anything @ git+https://github.com/facebookresearch/segment-anything.git", "PyYAML>=6.0", "torchvision>=0.20"]
quant = ["optimum-quanto>=0.2"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
llava-prior = "llava_prior.cli:main"
llava-prior-eval = "llava_prior.evaluate:main"
llava-prior-eval-voc = "llava_prior.evaluate:voc_main"
llava-prior-prepare-voc = "llava_prior.voc_subset:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"